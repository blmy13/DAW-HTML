<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link script src="js/scripts.js">
    </link>
    <title>Calculadora</title>
</head>

<body>
    <h1>CALCULADORA SIMPLE</h1>
    <div class="calculator">
        <input type="text" class="display" placeholder="0">
        <div class="buttons">
            <button class="btn_del"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="m456-320 104-104 104 104 56-56-104-104 104-104-56-56-104 104-104-104-56 56 104 104-104 104 56 56Zm-96 160q-19 0-36-8.5T296-192L80-480l216-288q11-15 28-23.5t36-8.5h440q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H360ZM180-480l180 240h440v-480H360L180-480Zm400 0Z"/></svg></button>
            <button class="btn_clear">C</button>
            <br>
            <button class="btn_number">7</button>
            <button class="btn_number">8</button>
            <button class="btn_number">9</button>
            <button class="btn_ope">+</button>
            <br>
            <button class="btn_number">4</button>
            <button class="btn_number">5</button>
            <button class="btn_number">6</button>
            <button class="btn_ope">-</button>
            <br>
            <button class="btn_number">1</button>
            <button class="btn_number">2</button>
            <button class="btn_number">3</button>
            <button class="btn_ope">*</button>
            <br>
            <button class="btn_dot">.</button>
            <button class="btn_number">0</button>
            <button class="btn_equal">=</button>
            <button class="btn_ope">/</button>


        </div>
</body>

</html>

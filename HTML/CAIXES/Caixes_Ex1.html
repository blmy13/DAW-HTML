<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .caixa {
            background-color: rgb(105, 252, 196);
            width: 300px;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 10px 10px 5px grey;
        }
        img {
            width: 100%;
            border-radius: 5px;
        }
        p {
            color: rgb(95, 75, 75);
        }

        h1 {
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div
        class="caixa">
        <img src="La vida es bella.jpg">
        <h1>La vida es bella</h1>
        <p>La vida és bella (títol original en italià La vita è bella) és una pel·lícula italiana dirigida i protagonitzada per Roberto Benigni i estrenada el 1997.</p>
    </div>

</body>
</html>

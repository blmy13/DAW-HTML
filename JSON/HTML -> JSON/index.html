            <label>Nom:</label>
            <input type="text" id="nom">
        </p>

        <p>
            <label>Email:</label>
            <input type="text" id="email">
        </p>

        <p>
            <label>Telèfon:</label>
            <input type="text" id="telefon">
        </p>

        <button type="submit">Afegir contacte</button>

    <p style="text-align:center;">
        <button id="btnBuidar">Buidar llista</button>
    </p>

    <h2>Llista de contactes</h2>
    <div id="llista"></div>

    <pre id="json"></pre>
